name: Build Mundial Conversas APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extrair projeto
        run: unzip -o Mundial_Conversas_2.0_GitHub.zip -d projeto

      - name: Verificar projeto Android
        run: |
          find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \)
