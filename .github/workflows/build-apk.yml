
name: Build Mundial Conversas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extrair projeto
        run: unzip -o Mundial_Conversas_2.0_GitHub.zip -d projeto

      - name: Construir APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd projeto
          DIR=$(find . \( -type f -name settings.gradle -o -type f -name settings.gradle.kts \) | head -n 1)
          if [ -z "$DIR" ]; then
            echo "Arquivo settings.gradle não encontrado"
            exit 1
          fi
          cd "$(dirname "$DIR")"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mundial-Conversas-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
